<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="快速成长指南" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="manifest" href="manifest.json?v=2.2" />
  <title>快速成长指南 · 认知持仓簿</title>
  <link rel="stylesheet" href="css/app.css?v=2.2" />
</head>
<body>
  <div class="app-wrapper">
    <div id="app-shell" class="app-shell">
      <!-- 顶部小程序导航栏 -->
      <header class="top-navbar">
        <div class="brand-group">
          <div class="brand-logo">🏰</div>
          <div>
            <div class="brand-title">快速成长指南 <span style="font-size:10px;color:#fbbf24;font-weight:500;">v2.2</span></div>
            <div class="brand-sub">类持仓簿 · 价值投资极速精读系统</div>
          </div>
        </div>
        <div class="top-actions">
          <button id="btn-view-mode" class="btn-top" onclick="GrowthApp.toggleWideMode()">🖥️ 宽屏视图</button>
          <button class="btn-top" onclick="GrowthApp.forceRefreshApp()" title="强制拉取最新书库">🔄 刷新</button>
          <button class="btn-top gold" onclick="GrowthApp.openNewBookModal()">＋ 新书建仓</button>
        </div>
      </header>

      <!-- 当前持仓研读书籍快捷切换横幅 -->
      <div id="active-book-bar" class="active-book-bar"></div>

      <!-- 主内容渲染区 -->
      <main id="main-content" class="main-content"></main>

      <!-- 底部四栏小程序 TabBar -->
      <nav id="bottom-tabbar" class="bottom-tabbar"></nav>
    </div>
  </div>

  <!-- 新书建仓与多书扩展架构 Modal -->
  <div id="new-book-modal" class="modal-backdrop" onclick="if(event.target===this)GrowthApp.closeNewBookModal()">
    <div class="modal-card">
      <div class="section-title">
        <span>📚 新书建仓 · 多书扩展工作台</span>
        <button class="btn-outline" style="padding:3px 8px;border-radius:6px;cursor:pointer;" onclick="GrowthApp.closeNewBookModal()">✕</button>
      </div>

      <div style="background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 12px;font-size:12px;color:#92400e;margin-bottom:14px;">
        <strong>💡 自动化 EPUB 深度拆解工作流：</strong><br/>
        1. 以后有新书时，直接将 <code>.epub</code> 文件放进 <code>/Users/frank/Desktop/快速阅读/</code> 目录；<br/>
        2. 运行 <code>python3 tools/parse_epub.py</code>（或直接让我帮你深度阅读），即可在 <code>data/books/</code> 下生成独立书籍数据包并挂载到书架！<br/>
        3. 你也可以在下方直接手动快速建仓一本新书：
      </div>

      <div class="form-group">
        <label class="form-label">书名</label>
        <input id="nb-title" class="form-input" placeholder="例如：聪明的投资者 / 安全边际 / 巴菲特致股东的信" />
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;" class="form-group">
        <div>
          <label class="form-label">作者</label>
          <input id="nb-author" class="form-input" placeholder="例如：本杰明·格雷厄姆" />
        </div>
        <div>
          <label class="form-label">所属认知赛道</label>
          <select id="nb-category" class="form-select">
            <option value="value-investing">🏰 价值投资核心</option>
            <option value="valuation-accounting">📐 财报与估值</option>
            <option value="cycle-psychology">🧭 周期与行为金融</option>
            <option value="mental-models">🌱 多元思维与成长</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">仓位等级</label>
        <select id="nb-position" class="form-select">
          <option value="core">核心重仓 · 深度内化</option>
          <option value="active" selected>建仓速读 · 正在攻克</option>
          <option value="watch">观察池 · 待建仓</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">这本书解决的核心问题（一句话）</label>
        <input id="nb-question" class="form-input" placeholder="例如：如何理解“市场先生”与“安全边际”两大基石？" />
      </div>

      <div class="form-group">
        <label class="form-label">核心思维模型 / 箴言提要</label>
        <textarea id="nb-thesis" rows="3" class="form-textarea" placeholder="写下这本书最核心的公式或投资金句..."></textarea>
      </div>

      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary" onclick="GrowthApp.submitNewBook()">✓ 立即建仓入库</button>
        <button class="btn btn-outline" onclick="GrowthApp.closeNewBookModal()">取消</button>
      </div>
    </div>
  </div>

  <!-- 模块化数据层与主程序按序加载（带版本号防手机主屏幕缓存） -->
  <script src="data/categories.js?v=2.2"></script>
  <script src="data/books/pat-dorsey-moat.js?v=2.2"></script>
  <script src="data/books/graham-intelligent-investor.js?v=2.2"></script>
  <script src="data/books/tangchao-financial-report.js?v=2.2"></script>
  <script src="data/books/howard-marks-most-important.js?v=2.2"></script>
  <script src="data/books/howard-marks-cycle.js?v=2.2"></script>
  <script src="data/books/preset-watchlist.js?v=2.2"></script>
  <script src="data/books-index.js?v=2.2"></script>
  <script src="js/store.js?v=2.2"></script>
  <script src="js/app.js?v=2.2"></script>
</body>
</html>
